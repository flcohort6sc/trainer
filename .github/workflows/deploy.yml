# Build and publish to GitHub Pages.
#
# `dist/` is gitignored on purpose -- committing build output means every change
# shows up twice in the diff and the two copies drift. This builds from source
# instead, so what is published is always what the tests ran against.
#
# Nothing here runs until the repository exists and Pages is switched on in
# Settings -> Pages -> Source: GitHub Actions.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never two deploys at once; never cancel one halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The engine suite is fast and needs no browser, so a broken plan never
      # reaches the phone.
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

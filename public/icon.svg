<!--
  The app icon: a barbell, steel bar and blue plates, on the app's own
  background. Pure geometry so it stays sharp at 40px on a home screen, and so
  the PNGs the manifest needs can be rasterised from it with what ships on a Mac.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#0f1115"/>
  <g transform="translate(256 256) scale(1.2) translate(-256 -256)">
    <rect x="96" y="245" width="320" height="22" rx="11" fill="#9aa3b2"/>
    <rect x="100" y="208" width="30" height="96" rx="8" fill="#4f8cff"/>
    <rect x="382" y="208" width="30" height="96" rx="8" fill="#4f8cff"/>
    <rect x="142" y="182" width="38" height="148" rx="10" fill="#4f8cff"/>
    <rect x="332" y="182" width="38" height="148" rx="10" fill="#4f8cff"/>
  </g>
</svg>
